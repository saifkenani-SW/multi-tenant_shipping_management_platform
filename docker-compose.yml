version: '3.8'

services:
    postgres_db:
        image: postgis/postgis:16-3.4
        container_name: multi-tenant_shipping_management_platform_db
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: multi-tenant_shipping_management_platform
        ports:
            - "51214:5432"  # المنفذ الخارجي 51214 ➜ الداخلي 5432 (PostgreSQL)
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        container_name: multi-tenant_shipping_management_platform_redis
        restart: always
        command: redis-server --appendonly yes
        ports:
            - "63791:6379"
        volumes:
            - redis_data:/data

volumes:
    postgres_data:
        driver: local

    redis_data:
        driver: local