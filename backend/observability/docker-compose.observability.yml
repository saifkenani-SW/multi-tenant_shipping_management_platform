version: '3.8'

# الوضع A — Self-Hosted (محلي)
# تشغيل: docker compose -f observability/docker-compose.observability.yml up -d
# Grafana على: http://localhost:3000

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: local_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      # في الوضع المحلي: يُصدَّر إلى Tempo عبر gRPC (منفذ 4317)
      - OTEL_BACKEND_ENDPOINT=tempo:4317
      - OTEL_BACKEND_INSECURE=true
      # لا مصادقة في الوضع المحلي
      - OTEL_BACKEND_AUTH=none
      - OTEL_DEPLOYMENT_ENVIRONMENT=development
    ports:
      - "4317:4317"   # استقبال gRPC من التطبيق
      - "4318:4318"   # استقبال HTTP من التطبيق
    restart: unless-stopped
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: local_tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: local_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: local_grafana
    ports:
      - "3001:3000"   # 3001 محلياً لتجنب التعارض مع NestJS (3000)
    environment:
      # مقبول فقط في الوضع المحلي — لا يُنسخ لأي بيئة إنتاج
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # إيقاف News Feed الخارجي (يسبب إشعار Unauthorized في البيئة المحلية)
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # السماح بتضمين الداشبوردات إذا احتاجها العميل في لوحة الأدمن
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./dashboards:/var/lib/grafana/dashboards
    depends_on:
      - tempo
      - prometheus

volumes:
  tempo_data:
  grafana_data:
  prometheus_data:
